name: Audio Sequence Exact Runtime

on:
  push:
    branches:
      - main
      - feat/audio-sequence-runtime-v1
      - feat/typed-audio-measurement-v1
      - feat/application-resolved-audio-plan-v1
    paths:
      - .github/workflows/audio-sequence-runtime.yml
      - package.json
      - package-lock.json
      - packages/contracts/**
      - packages/application/**
      - engines/media-ffmpeg/**
  pull_request:
    paths:
      - .github/workflows/audio-sequence-runtime.yml
      - package.json
      - package-lock.json
      - packages/contracts/**
      - packages/application/**
      - engines/media-ffmpeg/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-sequence-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-audio-runtime:
    name: Audio sequence exact runtime (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Report native toolchain and verify signature tool
        run: |
          sw_vers
          uname -m
          cc --version
          gpg --version
          gpgv --version
          python3 --version
      - run: npm ci
      - name: Build the typed Media execution path
        run: |
          npm run build -w @cevra/project-ir
          npm run build -w @cevra/contracts
          npm run build -w @cevra/i18n
          npm run build -w @cevra/application
          npm run build -w @cevra/media-ffmpeg
      - name: Prepare signature-verified release inputs
        run: |
          python3 engines/media-ffmpeg/runtime/prepare_ffmpeg_source.py "${RUNNER_TEMP}/ffmpeg-source"
          python3 engines/media-ffmpeg/runtime/prepare_vendor.py "${RUNNER_TEMP}/ffmpeg-skill"
          python3 engines/media-ffmpeg/runtime/prepare_python_runtime.py "${RUNNER_TEMP}/cevra-python"
      - name: Build pinned FFmpeg 9.0.1 for macOS arm64
        run: >-
          python3 engines/media-ffmpeg/runtime/build_ffmpeg.py
          "${RUNNER_TEMP}/ffmpeg-source/ffmpeg-9.0.1"
          "${RUNNER_TEMP}/cevra-ffmpeg"
          --jobs 3
      - name: Assemble and verify the exact managed runtime
        run: >-
          python3 engines/media-ffmpeg/runtime/assemble_runtime.py
          "${RUNNER_TEMP}/cevra-media-runtime"
          --python-root "${RUNNER_TEMP}/cevra-python"
          --ffmpeg-prefix "${RUNNER_TEMP}/cevra-ffmpeg"
          --vendor-source "${RUNNER_TEMP}/ffmpeg-skill"
      - name: Execute bounded multi-source audio acceptance catalog
        env:
          CEVRA_AUDIO_SEQUENCE_RELEASE: "1"
          CEVRA_AUDIO_SEQUENCE_RUNTIME_ROOT: ${{ runner.temp }}/cevra-media-runtime
          CEVRA_AUDIO_SEQUENCE_PYTHON: ${{ runner.temp }}/cevra-media-runtime/python/bin/python3.12
        run: node engines/media-ffmpeg/test_functional/audio-sequence-runtime.mjs
      - name: Characterize native audio measurement candidate
        run: >-
          python3 engines/media-ffmpeg/test_functional/audio-measurement-feasibility.py
          --ffmpeg "${RUNNER_TEMP}/cevra-media-runtime/bin/ffmpeg"
      - name: Execute read-only audio measurement acceptance catalog
        env:
          CEVRA_AUDIO_SEQUENCE_RELEASE: "1"
          CEVRA_AUDIO_SEQUENCE_RUNTIME_ROOT: ${{ runner.temp }}/cevra-media-runtime
          CEVRA_AUDIO_SEQUENCE_PYTHON: ${{ runner.temp }}/cevra-media-runtime/python/bin/python3.12
        run: node engines/media-ffmpeg/test_functional/audio-measurement-runtime.mjs
      - name: Execute Application resolved audio plan and final mux acceptance catalog
        env:
          CEVRA_AUDIO_SEQUENCE_RELEASE: "1"
          CEVRA_AUDIO_SEQUENCE_RUNTIME_ROOT: ${{ runner.temp }}/cevra-media-runtime
          CEVRA_AUDIO_SEQUENCE_PYTHON: ${{ runner.temp }}/cevra-media-runtime/python/bin/python3.12
        run: node engines/media-ffmpeg/test_functional/application-audio-plan-runtime.mjs
