name: Windows Media Runtime Evidence

on:
  push:
    branches:
      - feat/windows-media-runtime-evidence-v1
    paths:
      - .github/workflows/windows-media-runtime-evidence.yml
      - engines/media-ffmpeg/runtime/**
      - engines/media-ffmpeg/worker/**
      - engines/media-ffmpeg/test_python/test_windows_h264_feasibility.py
      - engines/media-ffmpeg/test_functional/windows_h264_mf_feasibility.py

permissions:
  contents: read

concurrency:
  group: windows-media-runtime-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-windows-h264-mf:
    name: Exact Windows x64 runtime and h264_mf evidence
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Report runner and bootstrap toolchain
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture
          python --version
          tar --version
          Get-PSDrive -Name ($env:RUNNER_TEMP.Substring(0, 1))
          cmd /c 'call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 && cl'

      - name: Bootstrap the exact pinned private CPython
        shell: pwsh
        run: |
          $versions = Get-Content engines/media-ffmpeg/runtime/versions.json -Raw | ConvertFrom-Json
          $pin = $versions.python.artifacts.'win32-x64'
          $archive = Join-Path $env:RUNNER_TEMP 'cevra-python-windows.tar.gz'
          Invoke-WebRequest -Uri $pin.url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $pin.sha256) { throw "managed CPython SHA-256 mismatch: $actual" }
          python engines/media-ffmpeg/runtime/prepare_python_runtime.py "$env:RUNNER_TEMP\cevra-python" --archive $archive
          & "$env:RUNNER_TEMP\cevra-python\python.exe" -I -B engines/media-ffmpeg/runtime/prepare_python_runtime.py "$env:RUNNER_TEMP\cevra-python" --verify-only
          & "$env:RUNNER_TEMP\cevra-python\python.exe" -I -B -c "import platform,struct; print(platform.python_version(), platform.machine(), struct.calcsize('P') * 8)"

      - name: Verify exact FFmpeg source signature and prepare vendor
        shell: pwsh
        run: |
          $env:PATH = "$env:PATH;C:\msys64\usr\bin;C:\Program Files\Git\usr\bin"
          gpg --version
          gpgv --version
          & "$env:RUNNER_TEMP\cevra-python\python.exe" -I -B engines/media-ffmpeg/runtime/prepare_ffmpeg_source.py "$env:RUNNER_TEMP\ffmpeg-source"
          & "$env:RUNNER_TEMP\cevra-python\python.exe" -I -B engines/media-ffmpeg/runtime/prepare_vendor.py "$env:RUNNER_TEMP\ffmpeg-skill"
          & "$env:RUNNER_TEMP\cevra-python\python.exe" -I -B engines/media-ffmpeg/runtime/prepare_vendor.py "$env:RUNNER_TEMP\ffmpeg-skill" --verify-only

      - name: Build exact pinned FFmpeg 9.0.1 with MSVC and Media Foundation
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set "PATH=%PATH%;C:\msys64\usr\bin;C:\Program Files\Git\usr\bin"
          set "CC=cl"
          "%RUNNER_TEMP%\cevra-python\python.exe" -I -B engines\media-ffmpeg\runtime\build_ffmpeg.py "%RUNNER_TEMP%\ffmpeg-source\ffmpeg-9.0.1" "%RUNNER_TEMP%\cevra-ffmpeg" --jobs 4

      - name: Assemble and verify the exact private Media Runtime
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\cevra-python\python.exe" -I -B engines/media-ffmpeg/runtime/assemble_runtime.py "$env:RUNNER_TEMP\cevra-media-runtime" --python-root "$env:RUNNER_TEMP\cevra-python" --ffmpeg-prefix "$env:RUNNER_TEMP\cevra-ffmpeg" --vendor-source "$env:RUNNER_TEMP\ffmpeg-skill"
          & "$env:RUNNER_TEMP\cevra-media-runtime\python\python.exe" -I -B "$env:RUNNER_TEMP\cevra-media-runtime\worker\cevra_media_worker.py" --info

      - name: Execute native h264_mf feasibility matrix
        id: feasibility
        continue-on-error: true
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-h264-evidence'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          & "$env:RUNNER_TEMP\cevra-media-runtime\python\python.exe" -I -B engines/media-ffmpeg/test_functional/windows_h264_mf_feasibility.py --runtime-root "$env:RUNNER_TEMP\cevra-media-runtime" --scratch "$env:RUNNER_TEMP\windows-h264-scratch" --output "$evidence\result.json"
          $probeExit = $LASTEXITCODE
          & "$env:RUNNER_TEMP\cevra-media-runtime\bin\ffmpeg.exe" -buildconf *> "$evidence\ffmpeg-buildconf.txt"
          & "$env:RUNNER_TEMP\cevra-media-runtime\bin\ffmpeg.exe" -hide_banner -h encoder=h264_mf *> "$evidence\h264-mf-options.txt"
          Copy-Item "$env:RUNNER_TEMP\cevra-media-runtime\manifest.json" "$evidence\runtime-manifest.json"
          Copy-Item "$env:RUNNER_TEMP\cevra-media-runtime\provenance\ffmpeg.json" "$evidence\ffmpeg-provenance.json"
          exit $probeExit

      - name: Upload bounded native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-h264-mf-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/windows-h264-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce native feasibility result
        if: steps.feasibility.outcome != 'success'
        shell: pwsh
        run: throw 'Native Windows h264_mf feasibility matrix did not pass; inspect the uploaded bounded evidence.'
