[package]
name = "cevra-vids-desktop"
version = "0.1.0"
description = "CEVRA Vids desktop application shell"
authors = ["CEVRA"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-shell = "=2.3.6"
tokio = { version = "=1.53.1", features = ["macros", "rt", "sync", "time"] }
